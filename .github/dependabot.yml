version: 2
updates:
  # Dev tooling (Playwright, axe). Runtime libraries are vendored and handled by
  # the vendor-update workflow instead — Dependabot cannot see them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, automated]
    groups:
      dev-tooling:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, automated]
