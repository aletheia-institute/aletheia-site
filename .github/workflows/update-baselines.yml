name: Update visual baselines

# Visual-regression baselines are platform-scoped. Run this manually (or after an
# intentional design change) to regenerate the Linux baselines CI compares against;
# it opens a PR so the new look is reviewed like any other change.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate baselines
        run: npx playwright test tests/visual.spec.js --update-snapshots
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/visual-baselines
          title: 'chore(test): update visual regression baselines'
          commit-message: 'chore(test): regenerate visual baselines'
          body: >
            Regenerated Linux visual baselines. Review the images in this diff —
            approving this PR is approving the new look of the site.
          labels: automated
