name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the complete suite
        run: npm test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble dist
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke — the live domain must serve THIS build
        run: |
          set -e
          URL="https://aletheiainstitute.ai"
          REF=$(grep -o 'css/main.css?v=[a-f0-9]*' dist/index.html | head -1)
          echo "expecting: $REF"
          LIVE=""
          for i in $(seq 1 18); do
            LIVE=$(curl -s "$URL/" | grep -o 'css/main.css?v=[a-f0-9]*' | head -1 || true)
            [ "$LIVE" = "$REF" ] && break
            echo "poll $i: served '$LIVE' — waiting for CDN…"; sleep 10
          done
          [ "$LIVE" = "$REF" ] || { echo "FAIL: live HTML never matched this build"; exit 1; }
          for a in $(grep -oE '(css|js|assets)/[^"?]+\?v=[a-f0-9]+' dist/index.html | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/$a")
            echo "$code  $a"
            [ "$code" = "200" ] || { echo "FAIL: hashed asset not serving"; exit 1; }
          done
          echo "SMOKE PASS: live HTML and all hashed assets are this build, atomically."
